<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Redirigiendo a WhatsApp...</title>
<style>
  body {
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #F3F6FB;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    text-align: center;
    background: #FFFFFF;
    padding: 32px 40px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .box p {
    color: #4B5563;
    font-size: 14px;
    margin: 12px 0 0;
  }
  .box a {
    color: #22B573;
    font-size: 14px;
    text-decoration: none;
    font-weight: 600;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E5E7EB;
    border-top-color: #22B573;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="mensajeEstado">Abriendo WhatsApp...</p>
    <p><a id="manualLink" href="#" target="ventana_whatsapp">Si no pasa nada, haz clic aquí</a></p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var numero = params.get('numero');

    if (numero) {
      var waWebUrl = 'https://wa.me/' + numero;
      document.getElementById('manualLink').href = waWebUrl;

      // Esta página NO corre dentro del sandbox de Power BI, así que
      // aquí sí funciona la reutilización de una ventana con nombre:
      // siempre la misma pestaña 'ventana_whatsapp', sin acumular.
      window.open(waWebUrl, 'ventana_whatsapp');

      // Cerramos esta página intermedia casi de inmediato: ya cumplió
      // su función (abrir o reutilizar la pestaña de WhatsApp).
      setTimeout(function () {
        window.close();
      }, 150);
    } else {
      document.getElementById('mensajeEstado').textContent = 'No se recibió ningún número de teléfono.';
    }
  </script>
</body>
</html>
