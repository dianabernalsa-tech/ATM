<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Redirigiendo a llamada...</title>
<style>
  body {
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #F3F6FB;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    text-align: center;
    background: #FFFFFF;
    padding: 32px 40px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .box p {
    color: #4B5563;
    font-size: 14px;
    margin: 12px 0 0;
  }
  .box a {
    color: #2255FF;
    font-size: 14px;
    text-decoration: none;
    font-weight: 600;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E5E7EB;
    border-top-color: #2255FF;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Abriendo tu aplicación de llamadas... esta pestaña se cerrará sola.</p>
    <p><a id="manualLink" href="#">Si no pasa nada, haz clic aquí</a></p>
  </div>

  <script>
    // Lee el número de teléfono desde la URL, ej: llamar.html?numero=%2B573001234567
    var params = new URLSearchParams(window.location.search);
    var numero = params.get('numero');

    if (numero) {
      var telUrl = 'tel:' + numero;
      document.getElementById('manualLink').href = telUrl;

      // Esta página SÍ corre fuera del "sandbox" de Power BI,
      // así que aquí la redirección a tel: no está bloqueada.
      window.location.href = telUrl;

      // Intentamos cerrar casi de inmediato: los navegadores suelen
      // bloquear el cierre si pasa mucho tiempo desde la acción del usuario.
      setTimeout(function () {
        window.close();
      }, 150);
    } else {
      document.querySelector('.box p').textContent = 'No se recibió ningún número de teléfono.';
    }
  </script>
</body>
</html>
